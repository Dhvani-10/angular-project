<div class="form-container">

  <h2 class="form-title">User Registration</h2>

  <form #regForm="ngForm"
        ngNativeValidate
        (ngSubmit)="regSubmit(regForm)">

    <div class="form-grid">

      <div class="form-group">
        <label>Full Name</label>
        <input type="text"
               name="fullname"
               ngModel
               required
               pattern="[A-Za-z ]+"
               title="Only alphabets allowed">
      </div>

      <div class="form-group">
        <label>Username</label>
        <input type="text"
               name="username"
               ngModel
               required
               pattern="[A-Za-z]+"
               title="Only alphabets allowed">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password"
               name="password"
               ngModel
               required
               minlength="6">
      </div>

      <div class="form-group">
        <label>Gender</label>
        <select name="gender"
                ngModel
                required>
          <option value="">Select Gender</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Date of Birth</label>
        <input type="date"
               name="dob"
               ngModel
               required
               [max]="maxDate">
      </div>

      <div class="form-group">
        <label>Mobile Number</label>
        <input type="text"
               name="mobile"
               ngModel
               required
               pattern="[0-9]{10}"
               title="Mobile must be 10 digits">
      </div>

      <div class="form-group full-width">
        <label>Email Address</label>
        <input type="email"
               name="email"
               ngModel
               required>
      </div>

      <div class="form-group full-width">
        <label>Aadhaar Number</label>
        <input type="text"
               name="aadhaar"
               ngModel
               required
               maxlength="14"
               pattern="[0-9]{4}-[0-9]{4}-[0-9]{4}"
               (input)="formatAadhaar($event)"
               title="Format: 1234-5678-9012">
      </div>

      <div class="form-group full-width">
        <label>Address</label>
        <textarea name="address"
                  ngModel
                  required
                  rows="3"></textarea>
      </div>

    </div>

    <div class="button-group">
      <button type="submit" class="btn-primary">Submit</button>
      <button type="reset" class="btn-secondary">Cancel</button>
    </div>

  </form>
</div>
