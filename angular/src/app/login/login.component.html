<div class="form-container">
  <form #loginForm="ngForm" (ngSubmit)="onClickSubmit(loginForm.value)">
    <h2 class="form-title">User Login</h2>

    <div class="form-group">
      <label>User Name</label>
      <input ngModel type="text" name="username" placeholder="Username" required>
    </div>

    <div class="form-group">
      <label>Password</label>
      <input ngModel type="password" name="password" placeholder="Password" required>
    </div>

    <div class="button-group">
      <input class="btn-primary" type="submit" value="Submit">
      <input class="btn-secondary" type="reset" value="Cancel">
    </div>

    <div style="text-align: center; margin-top: 15px; font-size: 15px;">
      <span>Don't have an account? </span>
      <a href="/register" class="register-link">Register Here</a> 
    </div>

  </form>
</div>
